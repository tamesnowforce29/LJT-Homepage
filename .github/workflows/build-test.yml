name: Jekyll Build Test

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'
          bundler-cache: true
      - name: Build with Jekyll
        run: bundle exec jekyll build
        env:
          JEKYLL_ENV: production
      - name: Verify generated site content
        run: |
          set -e
          test -f _site/index.html
          test -f _site/publications/index.html
          grep -q "Junteng Liu" _site/index.html
          grep -q "First-year PhD candidate at the HKUST NLP Group" _site/index.html
          grep -q "SynLogic: Synthesizing Verifiable Reasoning Data at Scale for Learning Logical Reasoning and Beyond" _site/index.html
          grep -q "On the Perception Bottleneck of VLMs for Chart Understanding" _site/index.html
          grep -q "On the Universal Truthfulness Hyperplane Inside LLMs" _site/index.html
          grep -q "In-Context Sharpness as Alerts: An Inner Representation Perspective for Hallucination Mitigation" _site/index.html
          grep -q "C-Eval: A Multi-Level Multi-Discipline Chinese Evaluation Suite for Foundation Models" _site/index.html
          grep -q "Composing Parameter-Efficient Modules with Arithmetic Operations" _site/index.html
          grep -q "jliugi@connect.ust.hk" _site/index.html
          grep -q "SynLogic: Synthesizing Verifiable Reasoning Data at Scale for Learning Logical Reasoning and Beyond" _site/publications/index.html
          grep -q "On the Perception Bottleneck of VLMs for Chart Understanding" _site/publications/index.html
          grep -q "On the Universal Truthfulness Hyperplane Inside LLMs" _site/publications/index.html
          grep -q "In-Context Sharpness as Alerts: An Inner Representation Perspective for Hallucination Mitigation" _site/publications/index.html
          grep -q "C-Eval: A Multi-Level Multi-Discipline Chinese Evaluation Suite for Foundation Models" _site/publications/index.html
          grep -q "Composing Parameter-Efficient Modules with Arithmetic Operations" _site/publications/index.html
          echo "All content checks passed."
