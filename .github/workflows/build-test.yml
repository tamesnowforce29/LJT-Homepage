name: Jekyll Build Test

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'
          bundler-cache: true
      - name: Build with Jekyll
        run: bundle exec jekyll build
        env:
          JEKYLL_ENV: production
      - name: Verify generated site content
        run: |
          test -f _site/index.html
          test -f _site/publications/index.html
          echo "=== index.html checks ==="
          grep -iF "Junteng Liu" _site/index.html || echo "MISSING: Junteng Liu"
          grep -iF "first-year PhD candidate at the HKUST NLP Group" _site/index.html || echo "MISSING: position"
          grep -iF "SynLogic: Synthesizing Verifiable Reasoning Data at Scale for Learning Logical Reasoning and Beyond" _site/index.html || echo "MISSING: SynLogic"
          grep -iF "On the Perception Bottleneck of VLMs for Chart Understanding" _site/index.html || echo "MISSING: Perception Bottleneck"
          grep -iF "On the Universal Truthfulness Hyperplane Inside LLMs" _site/index.html || echo "MISSING: Universal Truthfulness"
          grep -iF "In-Context Sharpness as Alerts: An Inner Representation Perspective for Hallucination Mitigation" _site/index.html || echo "MISSING: In-Context Sharpness"
          grep -iF "C-Eval: A Multi-Level Multi-Discipline Chinese Evaluation Suite for Foundation Models" _site/index.html || echo "MISSING: C-Eval"
          grep -iF "Composing Parameter-Efficient Modules with Arithmetic Operations" _site/index.html || echo "MISSING: Composing PEFT"
          grep -iF "jliugi@connect.ust.hk" _site/index.html || echo "MISSING: email"
          echo "=== publications/index.html checks ==="
          grep -iF "SynLogic: Synthesizing Verifiable Reasoning Data at Scale for Learning Logical Reasoning and Beyond" _site/publications/index.html || echo "MISSING: SynLogic"
          grep -iF "On the Perception Bottleneck of VLMs for Chart Understanding" _site/publications/index.html || echo "MISSING: Perception Bottleneck"
          grep -iF "On the Universal Truthfulness Hyperplane Inside LLMs" _site/publications/index.html || echo "MISSING: Universal Truthfulness"
          grep -iF "In-Context Sharpness as Alerts: An Inner Representation Perspective for Hallucination Mitigation" _site/publications/index.html || echo "MISSING: In-Context Sharpness"
          grep -iF "C-Eval: A Multi-Level Multi-Discipline Chinese Evaluation Suite for Foundation Models" _site/publications/index.html || echo "MISSING: C-Eval"
          grep -iF "Composing Parameter-Efficient Modules with Arithmetic Operations" _site/publications/index.html || echo "MISSING: Composing PEFT"
