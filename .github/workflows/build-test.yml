name: Jekyll Build Test

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'
          bundler-cache: true
      - name: Build with Jekyll
        run: bundle exec jekyll build
        env:
          JEKYLL_ENV: production
      - name: Verify generated site content
        run: |
          test -f _site/index.html && echo "OK: _site/index.html exists"
          test -f _site/publications/index.html && echo "OK: _site/publications/index.html exists"
          check() { if grep -qiF "$1" "$2"; then echo "OK: '$1' found in $2"; else echo "MISSING: '$1' in $2"; fi }
          check "Junteng Liu" _site/index.html
          check "first-year PhD candidate at the HKUST NLP Group" _site/index.html
          check "SynLogic: Synthesizing Verifiable Reasoning Data at Scale for Learning Logical Reasoning and Beyond" _site/index.html
          check "On the Perception Bottleneck of VLMs for Chart Understanding" _site/index.html
          check "On the Universal Truthfulness Hyperplane Inside LLMs" _site/index.html
          check "In-Context Sharpness as Alerts: An Inner Representation Perspective for Hallucination Mitigation" _site/index.html
          check "C-Eval: A Multi-Level Multi-Discipline Chinese Evaluation Suite for Foundation Models" _site/index.html
          check "Composing Parameter-Efficient Modules with Arithmetic Operations" _site/index.html
          check "jliugi@connect.ust.hk" _site/index.html
          check "SynLogic: Synthesizing Verifiable Reasoning Data at Scale for Learning Logical Reasoning and Beyond" _site/publications/index.html
          check "On the Perception Bottleneck of VLMs for Chart Understanding" _site/publications/index.html
          check "On the Universal Truthfulness Hyperplane Inside LLMs" _site/publications/index.html
          check "In-Context Sharpness as Alerts: An Inner Representation Perspective for Hallucination Mitigation" _site/publications/index.html
          check "C-Eval: A Multi-Level Multi-Discipline Chinese Evaluation Suite for Foundation Models" _site/publications/index.html
          check "Composing Parameter-Efficient Modules with Arithmetic Operations" _site/publications/index.html
